<title>MEXDER Derivados Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: terminal de mesa de derivados. Barra superior con emisora y ciclo, navegación lateral por módulos, área de trabajo en tarjetas. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#F7F9FB; --ink:#132033; --muted:#5A667A; --line:#DCE2EA;
  --accent:#1D4E9E; --accent-soft:#E3ECFA; --ochre:#B97A0C; --ochre-soft:#FBF0DA;
  --up:#13804F; --up-soft:#E2F4EA; --down:#BF3329; --down-soft:#FBE6E4; --warn:#A86A00;
  --grid:rgba(19,32,51,.08); --s3:#7446B8; --s4:#1F8796;
  --f-display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D131C; --surface:#141C28; --surface-2:#18222F; --ink:#E5EBF3; --muted:#94A1B5; --line:#26324A;
  --accent:#7DA6EE; --accent-soft:#1B2B47; --ochre:#E2AC45; --ochre-soft:#33270F;
  --up:#3DC489; --up-soft:#123326; --down:#F2705F; --down-soft:#3A1915; --warn:#E5A93A;
  --grid:rgba(229,235,243,.08); --s3:#B596EC; --s4:#5CC6D6; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0D131C; --surface:#141C28; --surface-2:#18222F; --ink:#E5EBF3; --muted:#94A1B5; --line:#26324A;
  --accent:#7DA6EE; --accent-soft:#1B2B47; --ochre:#E2AC45; --ochre-soft:#33270F;
  --up:#3DC489; --up-soft:#123326; --down:#F2705F; --down-soft:#3A1915; --warn:#E5A93A;
  --grid:rgba(229,235,243,.08); --s3:#B596EC; --s4:#5CC6D6; color-scheme:dark; }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1rem;font-weight:650}
p{margin:0}
a{color:var(--accent)}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}
.up{color:var(--up)} .down{color:var(--down)}

/* Top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.topbar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:.02em}
.brand span{color:var(--muted);font-size:12px;white-space:nowrap}
.brand .seal{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;background:var(--accent);color:var(--surface);font-family:var(--f-mono);font-weight:600;font-size:12px;align-self:center}
.ctrl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ctrl label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.quote{display:flex;align-items:baseline;gap:8px}
.quote .px{font-family:var(--f-mono);font-size:18px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.03em;border:1px solid transparent;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.live{color:var(--up);background:var(--up-soft)}
.chip.demo{color:var(--ochre);background:var(--ochre-soft)}
.chip.bull{color:var(--up);background:var(--up-soft)}
.chip.bear{color:var(--down);background:var(--down-soft)}
.chip.flat{color:var(--muted);background:var(--surface-2);border-color:var(--line)}
.chip.info{color:var(--accent);background:var(--accent-soft)}
.chip.plain::before{display:none}

/* Inputs */
input,select,button,textarea{font:inherit;color:inherit}
input[type=number],input[type=text],input[type=date],select{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0;height:32px}
input[type=number]{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:7px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.primary:hover{filter:brightness(1.08);color:var(--surface)}
.btn.ghost{background:transparent}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn.danger:hover{border-color:var(--down);color:var(--down)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:0 11px;height:30px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

/* Shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:0;min-height:calc(100vh - 60px)}
nav.side{border-right:1px solid var(--line);background:var(--surface);padding:14px 10px 30px;position:sticky;top:calc(56px + env(safe-area-inset-top,0px));align-self:start;max-height:calc(100vh - 56px);overflow:auto}
.navgroup{margin-bottom:14px}
.navgroup h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:0 10px 6px;font-weight:600}
.navgroup button{display:flex;width:100%;align-items:center;gap:9px;text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:7px;cursor:pointer;font-size:13.5px;color:var(--ink)}
.navgroup button .k{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);width:20px}
.navgroup button:hover{background:var(--surface-2)}
.navgroup button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navgroup button[aria-current="page"] .k{color:var(--accent)}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 60px;min-width:0}
.view{display:flex;flex-direction:column;gap:16px;max-width:1280px}
.view-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px;justify-content:space-between}
.view-head p{color:var(--muted);max-width:70ch;margin-top:3px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.card h3{margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sub{font-weight:500;color:var(--muted);font-size:12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.span2{grid-column:span 2}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 12px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.field .hint{font-size:11px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Stat tiles */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0}
.stat .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--f-mono);font-size:17px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .s{font-size:11.5px;color:var(--muted);margin-top:2px}

/* Tables */
.tbl-wrap{overflow:auto;max-width:100%;border:1px solid var(--line);border-radius:8px}
.tbl-wrap.tall{max-height:420px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{position:sticky;top:0;background:var(--surface-2);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;z-index:1}
td{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td.t{font-family:var(--f-body)}
tbody tr:hover{background:var(--surface-2)}
tr.hl td{background:var(--accent-soft)}
td.pos{color:var(--up)} td.neg{color:var(--down)}
.heat-pos{background:var(--up-soft)} .heat-neg{background:var(--down-soft)}

.chart{position:relative;height:300px;width:100%}
.chart.sm{height:170px}
.chart.lg{height:380px}
.note{font-size:12px;color:var(--muted);border-left:3px solid var(--line);padding:4px 10px}
.note.warn{border-color:var(--ochre)}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--ochre-soft);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:12.5px}
.banner b{color:var(--ochre)}
.sigrow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr) auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.sigrow:last-child{border-bottom:0}
.pill-list{display:flex;flex-direction:column;gap:8px}
.fig{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:4px;background:var(--surface-2)}
.fig .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:6px}
.tabs button{border:0;background:transparent;padding:6px 10px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.legs td.t{font-family:var(--f-body)}
.tree{font-family:var(--f-mono);font-size:11px}
.tree td{text-align:center;padding:3px 6px;border:0}
.tree .node{display:inline-block;border:1px solid var(--line);border-radius:5px;padding:2px 5px;background:var(--surface-2);line-height:1.25}
.tree .node.ex{border-color:var(--ochre);background:var(--ochre-soft)}
.rec{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:12px 14px}
.rec h4{font-size:14px;margin-bottom:4px;color:var(--accent)}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:8px;font-size:13px;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.desc{max-width:80ch;color:var(--muted);font-size:13px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 14px}
.checks label{display:flex;gap:8px;align-items:center;font-size:13px}
#params{position:relative}
#params .form{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}

@media (max-width: 980px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav.side{position:sticky;top:calc(var(--tb,98px) + env(safe-area-inset-top,0px));z-index:15;max-height:none;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:6px 10px}
  .navgroup{display:flex;gap:2px;margin:0;flex:none}
  .navgroup h4{display:none}
  .navgroup button{white-space:nowrap;padding:6px 9px;font-size:13px}
  .navgroup button .k{display:none}
  .g4,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width: 640px){
  .topbar{position:static}
  nav.side{top:env(safe-area-inset-top,0px)}
  .g2,.g3,.g4,.g6{grid-template-columns:minmax(0,1fr)}
  .span2{grid-column:auto}
  .brand span{display:none}
  .chart{height:250px}
  .sigrow{grid-template-columns:minmax(0,1fr) auto}
  .sigrow > :nth-child(2){display:none}
}
@media print{
  nav.side,.topbar .ctrl,.btn,.seg,#params .form{display:none!important}
  .shell{display:block}
  .view{max-width:none}
  .card{break-inside:avoid}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
